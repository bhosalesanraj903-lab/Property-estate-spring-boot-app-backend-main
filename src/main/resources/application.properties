# ===============================
# APP CONFIG
# ===============================
spring.application.name=real-estate-spring-boot-app
server.port=3060

# Secrets come from environment variables, or from a git-ignored
# local.properties next to pom.xml (overrides the values below)
spring.config.import=optional:file:./local.properties

# ===============================
# DATABASE CONFIG (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/propertydealer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

# ===============================
# SMS CONFIG (MSG91)
# ===============================
sms.api.url=https://api.msg91.com/api/v5/otp
sms.api.key=${SMS_API_KEY}
sms.sender.id=PRDEAL

# ===============================
# ADMIN EMAILS
# ===============================
app.admin.emails=owner@example.net,manager@example.net

# ===============================
# MAIL CONFIG (BREVO SMTP)
# ===============================
# Brevo > SMTP & API > SMTP tab: copy "Login" and generate an SMTP key
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# must be a sender verified in Brevo > Senders, Domains & Dedicated IPs
app.mail.from=${MAIL_FROM}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# OTHER SETTINGS
# ===============================
spring.main.allow-bean-definition-overriding=true
springdoc.override-with-generic-response=false
